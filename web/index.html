<!doctype html>
<meta charset="utf-8">
<title>Orchestrator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout concept: deep navy app bar, soft blue-gray canvas, white cards. Recommendations get an accent rule so they outrank metrics, and metrics outrank supporting notes. Technical detail stays behind the "Under the hood" switch. Light theme only. */
:root{
  color-scheme:light;
  --bg:#F3F7FB; --surface:#FFFFFF; --surface-2:#F6F9FC; --tint:#EAF6FD; --ink:#16232C; --ink-2:#55657A; --ink-3:#5E6E82;
  --line:#DCE5EE; --line-2:#E8EEF4;
  --primary:#0077B0; --primary-ink:#00638F; --primary-hover:#009BDF; --on-primary:#FFFFFF; --navy:#06293B; --navy-2:#0B3550;
  --accent:#5CC8F0; --highlight:#8FD8F5; --pill:#DDEEF7;
  --good-bg:#E3F2EA; --good-ink:#14653F; --good:#1F7A4D;
  --bad-bg:#FBE4E1; --bad-ink:#8F1D16; --bad:#B3261E;
  --warn-bg:#FBEFCF; --warn-ink:#6B4A00;
  --info-bg:#E1F0F8; --info-ink:#00587F;
  --mute-bg:#E9EEF2; --mute-ink:#46535C;
  --c-news:#0077B0; --t-news:#E3F1FA; --c-near:#1F7A4D; --t-near:#E3F2EA; --c-industry:#6B5BB0; --t-industry:#EEEAF8; --c-local:#4F7391; --t-local:#E8EEF4; --c-reviews:#A66A12; --t-reviews:#FBF0D9;
  --r-card:16px; --r-in:12px; --r-btn:12px;
  --shadow:0 1px 2px rgba(6,41,59,.05),0 8px 24px -12px rgba(6,41,59,.14);
  --shadow-up:0 2px 4px rgba(6,41,59,.06),0 14px 30px -12px rgba(6,41,59,.22);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;

}
*{box-sizing:border-box}
body{background:#F3F7FB linear-gradient(180deg,#E6F1F9 0,#F3F7FB 420px) no-repeat;color:var(--ink);font:400 17px/1.55 var(--font);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(30px,4.6vw,42px);line-height:1.12;letter-spacing:-.025em}
h2{font-size:22px;line-height:1.25}
h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit}
input{font:inherit}
:focus-visible{outline:3px solid var(--primary-hover);outline-offset:2px;border-radius:8px}
.top :focus-visible{outline-color:var(--highlight)}
.muted{color:var(--ink-2)} .small{font-size:15px} .num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}

/* app bar */
.top{background:linear-gradient(180deg,#06293B 0,#082F46 100%);border-bottom:1px solid rgba(143,216,245,.14);position:relative;z-index:5}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px}
html[data-edition="hackathon"]{--mark:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect width=%2728%27 height=%2728%27 rx=%277%27 fill=%27%230077B0%27/%3E%3Cpath d=%27M7 14.5l4.5 4.5L21 9%27 fill=%27none%27 stroke=%27white%27 stroke-width=%273.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E")}
.mark{width:38px;height:38px;border-radius:10px;background:#fff var(--mark) center/28px 28px no-repeat;box-shadow:0 1px 2px rgba(0,0,0,.25);flex:none}
.wm{font-weight:800;font-size:22px;letter-spacing:-.5px;color:#fff;line-height:1}
.wm b{color:var(--highlight);font-weight:800}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:8px}
.tabs button{white-space:nowrap;background:none;border:0;border-radius:10px;padding:9px 16px;font-weight:600;font-size:17px;color:rgba(255,255,255,.74);cursor:pointer;position:relative}
.tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
.tabs button[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff;font-weight:700}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:16px;right:16px;bottom:3px;height:2px;border-radius:2px;background:var(--accent)}
.tabs .n{background:var(--accent);color:var(--navy);border-radius:999px;font-size:12px;padding:1px 8px;margin-left:8px;font-weight:800}
.sp{flex:1}
.sw{display:inline-flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;font-size:13px;font-weight:600;color:rgba(255,255,255,.58);padding:4px}
.sw:hover{color:rgba(255,255,255,.85)}
.sw i{width:34px;height:20px;border-radius:999px;background:rgba(255,255,255,.2);position:relative}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff}
.sw[aria-checked="true"]{color:var(--highlight)}
.sw[aria-checked="true"] i{background:var(--accent)} .sw[aria-checked="true"] i::after{transform:translateX(14px)}

main.wrap{padding-block:36px 88px;display:flex;flex-direction:column;gap:28px}
.tagrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:var(--ink-2);font-weight:600}
.tag{background:var(--warn-bg);color:var(--warn-ink);font-weight:700;font-size:13px;border-radius:999px;padding:4px 12px}
.lead{font-size:19px;color:var(--ink-2);margin-top:10px;max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:28px 32px;box-shadow:var(--shadow);min-width:0;position:relative}
.card.soft{background:rgba(255,255,255,.55);box-shadow:none;border-style:solid;border-color:var(--line)}
.card.feature{border-color:#CBE3F2;overflow:hidden}
.card.feature::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.card.brief{background:linear-gradient(180deg,#fff 0,#F7FBFE 100%)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.card-h h2{margin:0}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.kind{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.back{background:none;border:0;color:var(--primary-ink);font-weight:700;cursor:pointer;padding:0;align-self:flex-start;font-size:16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--ink-3)}
.dot-news{background:var(--c-news)} .dot-near{background:var(--c-near)} .dot-industry{background:var(--c-industry)} .dot-local{background:var(--c-local)} .dot-reviews{background:var(--c-reviews)}

/* buttons */
.btn{display:inline-flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0A85BF 0,#0077B0 100%);color:var(--on-primary);border:1px solid #006A9C;border-radius:var(--r-btn);padding:14px 24px;font-weight:700;font-size:17px;cursor:pointer;line-height:1.2;box-shadow:0 1px 2px rgba(0,60,90,.25),inset 0 1px 0 rgba(255,255,255,.18)}
.btn:hover{background:linear-gradient(180deg,#1AA6E2 0,#009BDF 100%);border-color:#0089C4}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.out{background:#fff;color:var(--primary-ink);border:1.5px solid var(--primary);box-shadow:none}
.btn.out:hover{background:var(--tint);border-color:var(--primary-hover)}
.btn.quiet{background:#fff;color:var(--ink-2);border:1px solid var(--line);box-shadow:none}
.btn.quiet:hover{background:var(--surface-2);border-color:#C5D3E0;color:var(--ink)}
.btn.sm{padding:9px 16px;font-size:15px;border-radius:10px}
.btn[disabled]{background:var(--mute-bg);border-color:var(--mute-bg);color:var(--ink-3);cursor:not-allowed;box-shadow:none}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btns .btn{flex:1 1 240px}
.linkbtn{background:none;border:0;color:var(--primary-ink);font-weight:700;cursor:pointer;padding:0;font-size:inherit;text-decoration:underline;text-underline-offset:3px}

/* metrics */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
.tile{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-in);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.tile .l{color:var(--ink-2);font-size:14px;line-height:1.35;font-weight:500}
.tile .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--ink)}
.tile .up,.tile .down{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-weight:700;font-size:13px;border-radius:8px;padding:3px 10px;line-height:1.3}
.tile .up{background:var(--good-bg);color:var(--good-ink)} .tile .down{background:var(--bad-bg);color:var(--bad-ink)}
.tile .up::before{content:"\25B2";font-size:9px} .tile .down::before{content:"\25BC";font-size:9px}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-2);font-size:14px;margin-top:10px}

.why{margin:10px 0 20px;max-width:80ch}
.ba{display:grid;gap:12px;margin-bottom:14px}
.ba.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.b{border-radius:var(--r-in);padding:14px 18px;border:1px solid transparent}
.b span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.b.t{background:var(--bad-bg);color:var(--bad-ink);border-color:#F3CFCB} .b.s{background:var(--good-bg);color:var(--good-ink);border-color:#C9E4D5}
.b.n{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.fine{font-size:14.5px;color:var(--ink-2);margin-top:12px}


/* upload your own picture or video */
.drop{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border:2px dashed #9CCBE4;border-radius:var(--r-in);background:var(--tint);padding:14px 16px;cursor:pointer;position:relative;transition:background-color .18s ease,border-color .18s ease}
.drop:hover,.drop.over{background:#E3F2FB;border-color:var(--primary)}
.drop:focus-within{outline:3px solid rgba(0,119,176,.35);outline-offset:2px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop b{font-size:16px}.drop span{font-size:14px;color:var(--ink-2)}
.drop .btn{pointer-events:none}
.upmsg{font-size:14.5px;font-weight:600;color:var(--bad-ink);margin-top:8px}
.pick.mine .thumb{display:block;border-radius:8px;overflow:hidden;border:1px solid var(--line-2);line-height:0;background:#0b1b24;aspect-ratio:300/180}
.pick.mine .thumb img,.pick.mine .thumb video{width:100%;height:100%;object-fit:cover;display:block}
.linkbtn.rep{position:relative;cursor:pointer;overflow:hidden}.linkbtn.rep input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.owns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lab{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px}
.drop .ico{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--primary);display:grid;place-items:center;font-size:26px;font-weight:600;border:1px solid #CBE3F2;line-height:1;margin-bottom:4px}
.own{display:flex;flex-direction:column;gap:6px}.own .upinfo{margin-top:0;justify-content:center}
.tick{display:grid;gap:8px;margin-bottom:10px}
.tick label{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-in);padding:10px 14px;font-size:15px;cursor:pointer}
.tick label:has(input:checked){border-color:var(--good);background:var(--good-bg)}
.tick input{width:22px;height:22px;flex:none;accent-color:var(--primary)}
.upinfo{font-size:13.5px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.clean{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed #9CCBE4;border-radius:var(--r-in);padding:10px 14px;margin:0 0 10px;background:#fff}
.clean b{display:block;font-size:15px}.clean span{font-size:14px;color:var(--ink-2)}
.soon{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--tint);color:var(--primary-ink);border-radius:999px;padding:2px 8px;margin-left:6px}
.confirm{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-in);padding:10px 14px;font-size:15px;line-height:1.35;cursor:pointer}
.confirm input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--primary)}
.phone .pc .m{display:block;width:100%;object-fit:cover;background:#0b1b24}
.phone.story{max-width:250px}

/* reviews */
.stars{color:#D98E04;letter-spacing:2px;font-size:17px;white-space:nowrap}.stars i{font-style:normal;color:#D5DEE7}
.plat{font-size:12px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:2px 10px;text-transform:uppercase;border:1px solid transparent}
.plat.g{background:var(--tint);color:var(--primary-ink);border-color:#CBE3F2}.plat.y{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
h2+.rq,.kind+.rq{margin-top:14px}.rq{margin:0 0 14px;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r-in);padding:14px 16px}
.rq .rqh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.rq p{font-size:16px;line-height:1.5;margin:0}
.dist{display:grid;gap:6px;margin-top:20px;max-width:560px}.drow{display:grid;grid-template-columns:64px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14px;color:var(--ink-2)}
.drow i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--primary),var(--accent));width:var(--w)}.drow b{text-align:right;color:var(--ink)}
textarea.inp{resize:vertical;min-height:110px;line-height:1.5;font:inherit}
.badlist{margin:10px 0 0;padding:0;list-style:none;color:var(--bad-ink);font-weight:600;font-size:14.5px;display:grid;gap:4px}
.conn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:620px){.conn{grid-template-columns:minmax(0,1fr)}}
/* ad picture options */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0 0 8px}
.pick{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-in);padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative}
.pick:hover{border-color:#9CCBE4;box-shadow:var(--shadow-up)}
.pick[aria-pressed="true"]{border-color:var(--primary);background:var(--tint);box-shadow:0 0 0 3px rgba(0,119,176,.16)}
.pick[aria-pressed="true"]::after{content:"\2713";position:absolute;top:16px;right:16px;width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pick>span:first-child{display:block;border-radius:8px;overflow:hidden;border:1px solid var(--line-2);line-height:0}
.pick svg{width:100%;height:auto;display:block}
.pick img{width:100%;aspect-ratio:300/180;object-fit:cover;display:block}
.pick[disabled]{opacity:.65;cursor:not-allowed}.pick[disabled]:hover{border-color:var(--line);box-shadow:none}
.pick b{font-size:16px;padding:0 2px}
.res{font-size:13.5px;font-weight:700;padding:0 2px 2px}
.res.ok{color:var(--good-ink)} .res.warn{color:var(--warn-ink)}
.picknote{font-size:14px;color:var(--ink-3);margin:8px 0 18px}

.status{display:inline-block;font-weight:700;font-size:13px;border-radius:999px;padding:4px 12px;white-space:nowrap}
.s-ready{background:var(--info-bg);color:var(--info-ink)}
.s-done{background:var(--good-bg);color:var(--good-ink)}
.s-stop{background:var(--bad-bg);color:var(--bad-ink)}
.s-idle{background:var(--mute-bg);color:var(--mute-ink)}
.s-warn{background:var(--warn-bg);color:var(--warn-ink)}

.prog{display:flex;flex-direction:column;gap:12px;margin:6px 0 2px}
.prog div{display:flex;gap:12px;align-items:center;color:var(--ink-3);font-weight:600;font-size:18px}
.prog div.on{color:var(--ink)} .prog div.fin{color:var(--good-ink)}
.prog b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--mute-bg);font-size:14px;flex:none}
.prog .fin b{background:var(--good);color:#fff} .prog .on b{background:var(--primary);color:#fff}
.callout{border-radius:var(--r-in);padding:16px 18px}
.callout.good{background:var(--good-bg);color:var(--good-ink)} .callout.bad{background:var(--bad-bg);color:var(--bad-ink)}
.callout.info{background:var(--info-bg);color:var(--info-ink)} .callout.warn{background:var(--warn-bg);color:var(--warn-ink)}
.callout b{display:block;font-size:19px;margin-bottom:2px}

details{border-top:1px solid var(--line-2);margin-top:20px;padding-top:14px}
details summary{cursor:pointer;font-weight:700;color:var(--primary-ink);padding:2px 0}
details[open] summary{margin-bottom:12px}
details.plainbox{border:1px solid var(--line);border-radius:var(--r-card);background:#fff;padding:16px 24px;margin-top:0;box-shadow:var(--shadow)}
ul.plain{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px}
.checks .ok{color:var(--good);font-weight:800}
.checks .warn{color:var(--warn-ink);font-weight:800}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.hashchip{font-family:var(--mono);font-size:12px;background:var(--info-bg);color:var(--info-ink);border-radius:6px;padding:2px 8px}

/* ad studio */
.studio{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:36px;align-items:start}
.pv{display:flex;flex-direction:column;gap:10px;align-items:center;background:linear-gradient(180deg,var(--tint),#F3F7FB);border:1px solid var(--line-2);border-radius:var(--r-card);padding:20px}
.pvlab{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--primary-ink);background:#fff;border-radius:999px;padding:3px 12px;border:1px solid #CBE3F2}
.phone{border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 12px 28px -10px rgba(6,41,59,.28),0 2px 4px rgba(6,41,59,.06);max-width:340px;width:100%}
.phone .hd{display:flex;gap:10px;align-items:center;padding:12px 14px}
.phone .av{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
.phone .hd b{display:block;font-size:15px;line-height:1.2}
.phone .hd span.s{font-size:12px;color:var(--ink-3)}
.phone .pt{padding:0 14px 12px;font-size:15px;line-height:1.45}
.phone .pc svg{display:block;width:100%;height:auto}
.phone .ft{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface-2);border-top:1px solid var(--line-2)}
.phone .ft .dom{display:block;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.phone .ft{flex-wrap:wrap}.phone .ft>div{min-width:0;flex:1 1 140px}.phone .ft b{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.phone .cta{background:var(--mute-bg);color:var(--ink);font-weight:700;font-size:14px;border-radius:8px;padding:8px 12px;white-space:nowrap}
.ctl{margin-bottom:24px}
.ctl h3{margin-bottom:10px}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:600;cursor:pointer;font-size:15.5px;color:var(--ink-2)}
.opt:hover{border-color:#9CCBE4;color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:#fff;font-weight:700}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--tint);padding:4px;border-radius:14px;border:1px solid #D4E8F4}
.seg .opt{border:0;background:transparent;border-radius:10px;padding:8px 16px}
.seg .opt:hover{background:rgba(255,255,255,.6)}
.seg .opt[aria-pressed="true"]{background:#fff;color:var(--primary-ink);box-shadow:0 1px 3px rgba(6,41,59,.18)}

  if(!c.audio)return `<div class="player" style="background:var(--surface-2)"><div class="pl-body"><b>Audio is turned off</b><span class="small muted">You can turn it on in Configure.</span></div><button class="btn out sm" data-act="open-config">Open Configure</button></div>`;
  const sup=canSpeak(),main=AUD.on&&!AUD.single,sents=main?AUD.sentences:scriptSentences();const secs=Math.round(sents.join(' ').split(/\s+/).length/2.5/c.rate);const dur=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  const playing=main&&!AUD.paused,prog=main?Math.round((AUD.i+1)/sents.length*100):0;
  const sp=c.rate===1?'Normal speed':c.rate>1?'Faster':'Slower';
  return `<div class="player"><button class="play" data-act="aud-toggle" aria-label="${playing?'Pause':'Play'} today's audio update" ${sup?'':'disabled'}>${playing?ICON_PAUSE:ICON_PLAY}</button>
   <div class="pl-body"><b>Listen to today's update</b><span class="small muted">About ${dur}. ${sup?'Read aloud by your device.':'Read-aloud is not available in this browser. Read the text below.'}</span>${waveHtml(prog)}</div>
   <div class="pl-ctl"><button class="opt" data-act="aud-speed">${sp}</button>${main?'<button class="opt" data-act="aud-stop">Stop</button>':''}</div></div>
   ${full?det('audtext','Read the text instead',`<div class="tx">${sents.map((t,i)=>`<span class="${main&&AUD.i===i?'now':''}">${esc(t)}</span>`).join('')}</div><p class="fine">Muse Spark writes this script from today's notes. Your device's voice reads it.</p>`):''}`}
function updateAudio(){if(typeof document==='undefined')return;if(S.tab==='news'&&S.news.sub==='feed'){render();return}document.querySelectorAll?.('.aud-mount').forEach(el=>{el.innerHTML=audioHtml(el.dataset.full==='1')})}

  return `<section class="card"><div class="card-h"><h2>How your reviews are doing</h2><button class="btn out sm" data-act="analyze" ${S.checking>=0?'disabled':''}>Check for new reviews</button></div>
   <div class="tiles">${tile('Your average rating (out of 5)',R.avg,'Up from '+R.prevAvg,true)}${tile('New reviews in the last 4 weeks',R.newN,'Up from '+R.prevNew+' in the 4 weeks before',true)}${tile('New reviews you have answered',pc+'%','Was '+pp+'% before',pc>=pp)}${tile('Typical wait for a reply',R.wait+' days','Was '+R.prevWait+' days. Same day is best.',false)}</div>
   <div class="dist" role="img" aria-label="All ${R.total} reviews by stars: ${[5,4,3,2,1].map((n,i)=>R.dist[i]+' with '+n).join(', ')}">${[5,4,3,2,1].map((n,i)=>`<div class="drow"><span>${n} ${n===1?'star':'stars'}</span><i style="--w:${(R.dist[i]/mx*100).toFixed(0)}%"></i><b class="num">${R.dist[i]}</b></div>`).join('')}</div>
   <div class="legend"><span>All ${R.total} reviews on Google and Yelp. Sample data.</span></div></section>`}

function techDetails(key){const k=S.acts[key].kind,rep=k==='reply';const rows=rep?[['Read the review','reviews.get_review','2 stars, Google, Oct 25'],['Read your practice details and voice','reviews.get_practice_facts','phone, parking, tone: warm and short'],['Read your last replies','reviews.get_past_replies','5 replies, used for tone only'],['Check the privacy rules','policy.check_reply','first draft stopped; rewrite passed'],['Write the reply','plan.propose_review_reply','created '+S.acts[key].id]]:
  [['Read what nearby practices posted','brief.get_competitor_changes','Springfield Smiles added an implant cost page'],['Read the ad rules','creative.get_brand_rules','no before-and-after, no health claims, no promised results'],['Make 3 pictures','creative.generate_image (muse-image-1.0)','3 images, $0.03'],['Check each picture','creative.review_image (Spark vision)','1: 4 of 4. 2: 3 of 4, text small on phones. 3: 4 of 4'],['Write the ad draft','plan.propose_ad_draft','created act_9c21, paused, no budget']];
  const inT=rep?6200:22400,cached=rep?3000:12000,out=rep?900:3400,img=rep?0:0.03,cost=(inT-cached)*1.25/1e6+cached*0.15/1e6+out*4.25/1e6+img;
  return `<div class="under" style="margin-top:18px"><h3>Under the hood</h3><p class="small muted" style="margin-bottom:10px">Muse can only read data, write suggestions and make pictures. It has no passwords and cannot post or publish anything. A person approves, then separate code does the work and checks it.</p>
  <div class="scroll"><table><thead><tr><th>Step</th><th>Tool (read or suggest only)</th><th>Result</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="mono">${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
  <ul class="checks" style="margin-top:12px"><li><span class="ok">&#10003;</span><span>${rep?'Every fact in the reply comes from details you gave us':'Every fact the AI quoted matches data we fetched'}</span></li><li><span class="ok">&#10003;</span><span>${rep?'Review text is untrusted: it cannot give Muse instructions':'Every number in the summary matches our own calculation'}</span></li><li><span class="ok">&#10003;</span><span>${rep?'No hint the reviewer was a patient, no treatment named, no promises or health advice':'No before-and-after, health claims or promised results, in the words or the pictures'}</span></li></ul>
  <p class="small muted" style="margin-top:10px">muse-spark-1.3 &middot; ${fmt(inT)} tokens in (${fmt(cached)} cached), ${fmt(out)} out${img?' &middot; 3 images':''} &middot; about $${cost.toFixed(3)} (prices to be rechecked; pictures here are drawings, not Muse Image output) &middot; approval locked to code <span class="hashchip">${S.acts[key].hash.slice(0,12)}</span></p></div>`}
function briefTech(){const inT=9800,cached=4000,out=900,cost=(inT-cached)*1.25/1e6+cached*0.15/1e6+out*4.25/1e6+4*0.0025;
  const rows=[['Search the news','Muse web_search (built-in, 4 searches at most)','12 results read'],['Look at the practices you watch','webcrawl: compare their public pages with yesterday (robots.txt obeyed)','1 page changed'],['Drop repeats and low-relevance','deterministic filter: new since yesterday, matches your topics and area, not shown before','5 candidates, 2 kept'],['Write the notes','Muse Spark; every note must cite a page we fetched','2 notes'],['Check the citations','backend','2 of 2 notes link to a page we fetched'],['Write the audio script','Muse Spark, from today\'s notes only','about 40 seconds of text'],['Read it aloud','your device\'s built-in voice (Muse has no speech output; Muse Voice only turns speech into text)','free, no file stored']];
  return `<div class="under"><h3>Under the hood</h3><p class="small muted" style="margin-bottom:10px">A scheduled job runs once a day. News and web pages are untrusted text: they cannot give Muse instructions or tools. A note without a fetched source is dropped.</p>
  <div class="scroll"><table><thead><tr><th>Step</th><th>How</th><th>Result</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted" style="margin-top:10px">Noise limits are set in Configure (never more than 3 notes a day). About ${fmt(inT)} tokens in (${fmt(cached)} cached), ${fmt(out)} out, 4 searches: about $${cost.toFixed(3)} a day (prices to be rechecked).</p></div>`}

function progress(a){const rep=a.kind==='reply',st=a.state;const idx=st==='VERIFIED'?3:st==='EXECUTED'?1:0;const L=[rep?'Posting the reply':'Saving the ad draft','Checking that it worked','Done'];
  return `<div class="prog" aria-live="polite">${L.map((t,i)=>`<div class="${i<idx||(i===2&&st==='VERIFIED')?'fin':i===idx?'on':''}"><b>${i<idx||(i===2&&st==='VERIFIED')?'&#10003;':i+1}</b>${t}${i===idx&&st!=='VERIFIED'?'...':''}</div>`).join('')}</div>`}

    else b+=`<div class="ba"><div class="b s"><span>We suggest replying</span>${esc(a.after.reply)}</div></div><p style="margin:-2px 0 14px"><button class="linkbtn" data-act="rev-edit" data-kind="${key}">Change the wording</button></p>
      ${S.rejecting===key?rejectBox(key):`<div class="btns"><button class="btn" data-act="approve" data-kind="${key}">${yelp?'Yes, approve this reply':'Yes, post this reply'}</button><button class="btn out" data-act="start-reject" data-kind="${key}">Not now</button></div>`}
      <p class="fine">${yelp?'Yelp does not let apps post replies. After you approve, copy it and paste it into Yelp yourself.':'Your OK covers exactly this reply. If the review changes before we post, we stop and ask you again.'} No cost. This OK expires in ${hours()} hours.</p>
      ${det('rv-more-'+key,'More details',`<h3 style="margin:4px 0 8px">Safety checks</h3><ul class="checks"><li><span class="ok">&#10003;</span><span>It does not say or hint that the reviewer was a patient</span></li><li><span class="ok">&#10003;</span><span>It names no treatment and gives no health advice</span></li><li><span class="ok">&#10003;</span><span>No promises, refunds or invented facts${r.fact?'. '+esc(r.fact):''}</span></li><li><span class="ok">&#10003;</span><span>Written in your practice's voice, from your last replies</span></li><li><span class="ok">&#10003;</span><span>${yelp?'Nothing is posted by us':'Nothing is posted until you say yes'}</span></li></ul><p class="fine">${yelp?'This demo has no Yelp connection.':'This demo posts to a practice sandbox, not to Google.'}</p>`)}`}
  else if(a.handoff)b+=`<div class="callout good"><b>&#10003; Approved. Now paste it into Yelp</b>We cannot post to Yelp and cannot check it afterwards. Copy the reply and paste it under the review.</div><div class="ba" style="margin-top:14px"><div class="b s"><span>Your approved reply</span>${esc(a.after.reply)}</div></div><div class="btns"><button class="btn" data-act="rev-copy" data-kind="${key}">${S.copied===key?'&#10003; Copied':'Copy the reply'}</button></div>`;
  else if(st==='APPROVED'||st==='EXECUTING'||st==='EXECUTED')b+=progress(a);

  else if(st==='FAILED')b+=`<div class="callout bad"><b>We stopped. Nothing was posted.</b>The review was edited after you said yes, so what you approved no longer matched. We posted nothing.</div><div class="btns" style="margin-top:14px"><button class="btn" data-act="repropose" data-kind="${key}">Look at it again</button></div>`;
  else b+=`<div class="callout info"><b>You said not now</b>${esc(a.reason.replace('Reason: ',''))}. Nothing was posted.</div><div class="btns" style="margin-top:14px"><button class="btn out" data-act="repropose" data-kind="${key}">Look at it again</button></div>`;
  return b}
function rvFeature(){if(!S.acts.rv1)return '';return `<article class="card feature"><span class="kind">Needs your personal touch</span><h2>A 2-star Google review is waiting</h2>${revBody('rv1')}${S.under?techDetails('rv1'):''}</article>`}

function verifyChain(){let prev='0'.repeat(14);for(const e of S.events){const payload=(S.tamper&&e.seq===2)?JSON.stringify({type:e.type,plain:e.plain+' (edited)',detail:e.detail}):e.payload;if(e.prev!==prev||h53(prev+'|'+e.seq+'|'+e.ts+'|'+payload)!==e.hash)return {ok:false,at:e.seq};prev=e.hash}return {ok:true,n:S.events.length}}
function activity(){const res=S.verify?(S.verify.ok?`<div class="callout good"><b>The record is intact</b>${S.verify.n} entries checked. None has been altered.</div>`:`<div class="callout bad"><b>The record was altered at entry ${S.verify.at}</b>The stored text no longer matches its fingerprint.</div>`):'';
  return det('activity','What we have done so far',`<ul class="timeline">${[...S.events].reverse().map(e=>`<li><time>${e.time}</time><span>${esc(e.plain)}</span></li>`).join('')}</ul>
  ${S.under?`<div class="under" style="margin-top:14px"><h3>Under the hood: prove the record has not been changed</h3><p class="small muted" style="margin-bottom:12px">Each entry stores a fingerprint of the one before it, so changing history is detectable. This demo uses a simple fingerprint; the real system uses SHA-256.</p>
   <div class="row" style="margin-bottom:12px"><button class="btn sm" data-act="verify">Check the record</button><button class="btn out sm" data-act="tamper">${S.tamper?'Undo the edit':'Pretend someone edited entry 2'}</button></div>${res}
   <div class="scroll" style="margin-top:12px"><table><thead><tr><th>#</th><th>Event</th><th>Detail</th><th>Previous</th><th>Fingerprint</th></tr></thead><tbody>${S.events.map(e=>`<tr><td class="num">${e.seq}</td><td class="mono">${e.type}</td><td>${esc(e.detail)}${S.tamper&&e.seq===2?' <span class="status s-stop">edited</span>':''}</td><td class="mono">${e.prev.slice(0,8)}</td><td class="mono">${e.hash.slice(0,8)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`,'plainbox')}

function updateSummary(){const c=S.cfg,on=Object.keys(TOPICS).filter(k=>c.topics[k]).map(k=>TOPICS[k].label.toLowerCase());const fq=c.freq==='daily'?'every day at '+c.time:c.freq==='weekly'?'once a week, Monday at '+c.time:'only when something matters';

    <h3 style="margin:18px 0 10px">Add a practice</h3><div class="row" style="align-items:flex-end"><div class="fld"><label for="pname">Practice name</label><input class="inp" id="pname" placeholder="For example: Riverside Dental" autocomplete="off"></div><div class="fld"><label for="purl">Website</label><input class="inp" id="purl" placeholder="riversidedental.example" autocomplete="off"></div><button class="btn sm" data-act="cfg-add">Add</button></div>

function cleanRow(){if(!UP||UP.kind==='video')return '';return `<p class="small" style="margin-top:6px">Patients in your picture? <button class="linkbtn" data-act="up-clean" aria-expanded="${UPCLEAN}">Clean up picture</button> <em class="soon">Planned</em></p>${UPCLEAN?'<p class="small muted">Not in this demo. In the real app, Muse Image would redraw your picture without people and show it next to the original. For now, upload a picture without people.</p>':''}`}
function fitNote(a){if(!UP)return '';const want=RVAL[a.after.format],have=UP.w/UP.h;if(Math.abs(have/want-1)<=.15)return '';return `<p class="small" style="margin:0 0 10px;color:var(--warn-ink);font-weight:600">&#9888; The edges will be cropped to fit the ${SHAPES[a.after.format].split(' ')[0].toLowerCase()} shape. Try another shape above.</p>`}
const adFoot=()=>`<section class="card"><h2 style="margin-bottom:6px">Other ads</h2><div>
   ${S.ideas.map(i=>`<div class="li"><div><b>${esc(i)}</b><span class="muted small">From the news</span></div><span class="status s-idle">Idea</span></div>`).join('')}
   <div class="li"><div><b>Family dentistry: welcome new patients</b><span class="muted small">Next idea in line</span></div><span class="status s-idle">Idea</span></div>
   ${S.ads.filter(p=>p.picture==='-'&&!(LIVE&&S.acts.ad&&S.acts.ad.state==='VERIFIED'&&S.acts.ad.after.name===p.name)).map(p=>`<div class="li"><div><b>${esc(p.name)}</b><span class="muted small">Saved earlier, not running</span></div><span class="status s-idle">Paused</span></div>`).join('')}</div></section>
  <section class="card soft"><h3 style="margin-bottom:10px">How we make ads for you</h3><ul class="plain"><li>We write the words and make picture options. You pick.</li><li>Every picture and every line is checked against ad rules before you see it.</li><li>No patient photos, before-and-after shots, invented ratings or promised results.</li><li>Drafts are saved paused. Switching one on is its own OK, and you or your team set the budget.</li></ul></section>`;
function vAds(){if(LIVE)return `<div><h1>Ads</h1><p class="lead">Draft an ad, check it, and choose. We never switch an ad on or spend money without your OK.</p></div>${vAdsLive()}${adFoot()}`;const a=S.acts.ad,st=a.state;const open=st==='PROPOSED';

     <div class="ctl"><h3>2. Choose how it sounds</h3><div class="chips seg">${Object.keys(TONES).map(k=>chip('tone',k,TONES[k].label,a.after.tone===k)).join('')}</div></div>
     <div class="ctl"><h3>3. Choose the shape</h3><div class="chips seg">${Object.keys(SHAPES).map(k=>chip('shape',k,SHAPES[k],a.after.format===k)).join('')}</div></div>

function render(){const n=todayList().length;

/* ---- actions ---- */
async function analyze(){S.tab='week';S.checking=0;render();window.scrollTo(0,0);for(let i=1;i<=4;i++){await sleep(600);S.checking=i;render()}await sleep(400);S.checking=-1;render()}
async function execute(kind){const a=S.acts[kind];if(a.state!=='APPROVED'||a.handoff)return;const rep=a.kind==='reply';
  setState(a,'EXECUTING');addEvent('execution.started',rep?'We are posting your reply now.':'We are saving the ad draft now.',a.id+' attempt '+a.attempt+'; '+a.idem);render();await sleep(900);
  if(!preOk(a)){setState(a,'FAILED','precondition_changed');addEvent('execution.refused',rep?'We stopped. The review was edited after you said yes, so we did not post anything.':'We stopped. An ad with that name already exists, so we did not save anything.','precondition_changed; nothing written');render();return}
  applyAct(a);setState(a,'EXECUTED');addEvent('execution.succeeded',rep?'We posted your reply.':'We saved the ad as a paused draft. It is not running.','provider accepted write');render();await sleep(900);
  if(verifyOk(a)){setState(a,'VERIFIED');addEvent('verification.passed',rep?'We looked at the review again. Your reply is showing.':'We checked the ad draft again. It is saved, paused, and matches what you approved.','independent read-back equals expected')}
  else{setState(a,'FAILED','verification_mismatch');addEvent('verification.failed','We checked and it did not match. Please look at it.','read-back differs')}
  render()}
function drift(kind){if(kind==='rv1'){S.rev.g1.text+=' (Edit: the wait was closer to an hour.)';addEvent('sandbox.changed','The reviewer edited their review (demo).','review text changed outside the orchestrator')}
  else{S.ads.push({name:AD_AFTER.name,status:'paused',picture:'B',headline:'Implant ad (teammate draft)',text:'',format:'wide'});addEvent('sandbox.changed','A teammate already saved an ad with that name (demo).','name collision')}}
async function liveApprove(key){const a=S.acts[key];a.state='EXECUTING';render();
  try{if(S.sim[key]){if(a.kind==='ad')await api('POST','/demo/ads/collide',{name:a.after.name});else await api('POST','/demo/reviews/'+a.after.review+'/edit',{});S.sim[key]=false}
    await api('POST','/proposals/'+a.id+'/approve',{hash:a.hash})}catch(e){S.apiErr=e.message}
  await refreshLive();render()}
async function approve(kind){if(LIVE&&S.acts[kind].live)return liveApprove(kind);const a=S.acts[kind];if(kind==='ad'&&a.after.picture==='U'&&!(UP&&UP.ok))return;setState(a,'APPROVED');
  if(a.kind==='reply'&&a.after.platform==='Yelp'){a.handoff=true;addEvent('action.approved','You approved the reply to the Yelp review. Yelp does not let apps post, so you paste it yourself.','bound to hash '+a.hash.slice(0,12)+'; manual handoff');addEvent('handoff.manual','We posted nothing on Yelp.','provider has no reply endpoint in this plan; no read-back possible');render();return}
  addEvent('action.approved',a.kind==='reply'?'You said yes to posting your reply to the Google review. Your OK expires in 24 hours.':'You said yes to saving the ad ('+TONES[a.after.tone].label.toLowerCase()+' wording, '+(a.after.picture==='U'?'your own '+(a.after.media?a.after.media.kind:'file'):'picture option '+(['A','B','C'].indexOf(a.after.picture)+1))+', '+SHAPES[a.after.format].toLowerCase()+' shape) as a paused draft. Your OK expires in 24 hours.','bound to hash '+a.hash.slice(0,12));
  render();await sleep(500);if(S.sim[kind]){drift(kind);S.sim[kind]=false}await execute(kind)}
function adEdit(fn){const a=S.acts.ad;if(a.state!=='PROPOSED')return;fn(a);rehash(a);render()}
function cfgEvent(plain,detail){addEvent('config.changed',plain,detail||'setting stored');const el=typeof document!=='undefined'?$('#savedchip'):null;if(el&&el.classList){el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1800)}}
function addPractice(){const n=($('#pname')||{}).value||'',u=($('#purl')||{}).value||'';const name=n.trim(),url=u.trim().replace(/^https?:\/\//,'');
  if(!name||!url){S.news.msg='Please fill in both the name and the website.';render();return}
  if(!/^[a-z0-9.-]+\.[a-z]{2,}([\/].*)?$/i.test(url)){S.news.msg='That website does not look right. Try something like riversidedental.example';render();return}
  if(S.cfg.practices.length>=5){S.news.msg='You can watch up to 5 practices.';render();return}
  if(S.cfg.practices.some(p=>p.name.toLowerCase()===name.toLowerCase())){S.news.msg='You are already watching that practice.';render();return}
  S.cfg.practices.push({name,url});S.news.msg='';cfgEvent('You added '+name+' to the practices we watch. We start tomorrow.','practice allowlist +1: '+url);render()}

function removeUp(){if(!UP)return;URL.revokeObjectURL(UP.url);UP=null;UPMSG='';UPCLEAN=false;adEdit(a=>{if(a.after.picture==='U')a.after.picture='A';a.after.media=null})}
function probe(f,kind,url){return new Promise((ok,no)=>{const el=document.createElement(kind==='video'?'video':'img');const t=setTimeout(()=>no(),8000);
  el.onerror=()=>{clearTimeout(t);no()};
  if(kind==='video'){el.preload='metadata';el.muted=true;el.onloadedmetadata=()=>{clearTimeout(t);ok({w:el.videoWidth,h:el.videoHeight,dur:el.duration})};el.src=url}
  else{el.onload=()=>{clearTimeout(t);ok({w:el.naturalWidth,h:el.naturalHeight,dur:0})};el.src=url}})}
async function takeFile(f){if(!f)return;const a=S.acts.ad;if(!a||a.state!=='PROPOSED')return;
  const kind=/^image\/(jpeg|png)$/.test(f.type)?'image':/^video\/(mp4|quicktime)$/.test(f.type)?'video':'';
  if(!kind){UPMSG='That file type does not work here. Please use a JPG or PNG picture, or an MP4 video.';render();return}
  const max=kind==='image'?8*1048576:50*1048576;
  if(f.size>max){UPMSG=`That file is ${mb(f.size)}, which is too big. Pictures can be up to 8 MB and videos up to 50 MB.`;render();return}
  const url=URL.createObjectURL(f);let m;
  try{m=await probe(f,kind,url)}catch(e){URL.revokeObjectURL(url);UPMSG='We could not open that file. Please try another one.';render();return}
  if(kind==='video'&&m.dur>60){URL.revokeObjectURL(url);UPMSG=`That video is ${Math.round(m.dur)} seconds long. Videos can be up to 60 seconds.`;render();return}
  if(UP)URL.revokeObjectURL(UP.url);
  UP={kind,url,name:f.name,size:f.size,w:m.w,h:m.h,dur:m.dur,ok:false,c:[false,false,false,false]};UPMSG='';UPCLEAN=false;
  addEvent('creative.uploaded','You added your own '+kind+' to the ad. It stays in this browser.','local file, '+mb(f.size)+'; not sent to Muse in this demo');
  adEdit(x=>{x.after.picture='U';x.after.media=mediaOf()})}
document.addEventListener('change',e=>{const i=e.target.closest('.upin');if(i){takeFile(i.files[0]);return}const u=e.target.closest('[data-act="upok"]');if(u&&UP){UP.c[+u.dataset.i]=u.checked;UP.ok=UP.c.every(Boolean);render()}});
['dragenter','dragover'].forEach(n=>document.addEventListener(n,e=>{e.preventDefault();const d=e.target.closest&&e.target.closest('.dropc');if(d)d.classList.add('over')}));
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('.dropc');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{e.preventDefault();const d=e.target.closest&&e.target.closest('.dropc');if(d){d.classList.remove('over');takeFile(e.dataTransfer&&e.dataTransfer.files[0])}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.tagName==='DETAILS'&&d.dataset.key)S.open[d.dataset.key]=d.open},true);
document.addEventListener('change',e=>{const el=e.target.closest('[data-act="sim"]');if(el){S.sim[el.dataset.kind]=el.checked}const q=e.target.closest('[data-act="quiet"]');if(q){S.quiet=q.checked;render()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.dataset.act==='sim'||el.dataset.act==='quiet')return;const act=el.dataset.act,kind=el.dataset.kind,val=el.dataset.val;
  switch(act){
   case 'tab':S.tab=el.dataset.tab;if(S.tab==='news')S.news.sub='feed';S.rejecting=null;S.editing=null;S.rmsg=null;render();window.scrollTo(0,0);break;
   case 'under':S.under=!S.under;render();break;
   case 'analyze':analyze();break;
   case 'pick':if(LIVE&&S.acts.ad&&S.acts.ad.live){adCall('/picture',{sha:el.dataset.pick});break}adEdit(a=>{a.after.picture=el.dataset.pick;a.after.media=a.after.picture==='U'?mediaOf():null});break;
   case 'up-remove':removeUp();break;
   case 'up-clean':UPCLEAN=!UPCLEAN;render();break;
   case 'tone':adEdit(a=>{a.after.tone=val;a.after.text=TONES[val].text});break;
   case 'shape':if(LIVE&&S.acts.ad&&S.acts.ad.live){adCall('/edit-ad',{format:FMT_API[val]});break}adEdit(a=>{a.after.format=val});break;
   case 'approve':approve(kind);break;
   case 'ad-draft':{S.adName=(($('#adname')||{}).value||'').trim();S.adBusy=true;S.adMsg='';render();
     api('POST','/ads/propose',{name:S.adName,format:'wide'}).then(r=>{if(r.id){S.acts.ad=toAdAct(r);S.adNew=false;S.adEditing=false;S.amsg=null}else S.adMsg=r.reason||'We could not draft an ad.'}).catch(e=>{S.adMsg=adMsgText(e)}).then(()=>loadLiveAds()).then(()=>syncEvents()).catch(()=>{}).then(()=>{S.adBusy=false;render()});break}
   case 'ad-edit':S.adEditing=true;S.adDraft=null;S.amsg=null;render();break;
   case 'ad-cancel':S.adEditing=false;S.adDraft=null;S.amsg=null;render();break;
   case 'ad-save':{const h=(($('#ahead')||{}).value||'').trim(),t=(($('#atext')||{}).value||'').trim();S.adEditing=true;S.adDraft={h,t};adCall('/edit-ad',{headline:h,text:t}).then(()=>{if(!S.amsg){S.adEditing=false;S.adDraft=null}render()});break}
   case 'start-reject':S.rejecting=kind;render();break;
   case 'cancel-reject':S.rejecting=null;render();break;
   case 'reject':{if(LIVE&&S.acts[kind].live){api('POST','/proposals/'+S.acts[kind].id+'/reject',{reason:el.dataset.why}).then(refreshLive).then(()=>{S.rejecting=null;render()});break}const a=S.acts[kind];setState(a,'REJECTED','Reason: '+el.dataset.why);addEvent('action.rejected','You said not now to '+(a.kind==='reply'?'the reply':'the ad draft')+'. '+el.dataset.why+'.','rejected by operator');S.rejecting=null;render();break}
   case 'repropose':{if(LIVE&&kind==='ad'&&S.acts.ad&&S.acts.ad.live){const a=S.acts.ad;S.adName=a.after.name+(a.state==='FAILED'||a.state==='VERIFIED'?' v2':'');S.adNew=true;S.acts.ad=null;S.adMsg='';S.rejecting=null;render();break}if(LIVE&&S.acts[kind].kind==='reply'){api('POST','/reviews/'+S.acts[kind].after.review+'/propose').then(refreshLive).then(render);break}if(S.acts[kind].kind==='reply')S.acts[kind]=newReply(kind,S.acts[kind].attempt+1,S.acts[kind].after.reply);else{const k=S.acts.ad.after;if(S.ads.some(p=>p.name===AD_AFTER.name))AD_AFTER.name=AD_NAME0+' (v2)';S.acts.ad=newAct('ad',S.acts.ad.attempt+1,{exists:false},{picture:k.picture,media:k.media,tone:k.tone,format:k.format})}
      const a=S.acts[kind];addEvent('action.proposed','We looked again as things are now. Your OK is needed.',a.id+' attempt '+a.attempt+'; hash '+a.hash.slice(0,12));render();break}
   case 'rev-edit':S.editing=kind;S.rmsg=null;render();break;
   case 'rev-cancel':S.editing=null;S.rmsg=null;render();break;
   case 'rev-save':{if(LIVE){const a=S.acts[kind],t=(($('#rtext')||{}).value||'').trim();api('POST','/proposals/'+a.id+'/edit',{reply:t}).then(refreshLive).then(()=>{S.editing=null;S.rmsg=null;render()}).catch(e=>{S.rmsg={key:kind,list:e.issues?e.issues.map(i=>i.message):[e.message]};render()});break}const a=S.acts[kind],t=(($('#rtext')||{}).value||'').trim(),iss=lintReply(t);if(iss.length){S.rmsg={key:kind,list:iss};render();break}
      a.after.reply=t;rehash(a);S.editing=null;S.rmsg=null;addEvent('draft.edited','You changed the wording of a reply. We checked it again and it passed.','privacy check passed; hash '+a.hash.slice(0,12));render();break}
   case 'rev-copy':{const a=S.acts[kind];try{navigator.clipboard&&navigator.clipboard.writeText(a.after.reply).catch(()=>{})}catch(e){}S.copied=kind;render();setTimeout(()=>{S.copied=null;if(S.tab==='reviews'||S.tab==='week')render()},1800);break}
   case 'rev-filter':S.rfilter=val;render();break;
   case 'reset':audioStop();if(LIVE){init();S.loading=true;render();api('POST','/demo/reset').then(()=>loadLive()).then(()=>{S.loading=false;render();window.scrollTo(0,0)})}else{init();render();window.scrollTo(0,0)}break;
   case 'verify':if(LIVE){api('GET','/audit/verify').then(v=>{S.verify={ok:v.ok,n:v.checked,at:v.at};render()})}else{S.verify=verifyChain();render()}break;
   case 'tamper':if(LIVE){api('POST','/demo/audit/tamper',{on:!S.tamper}).then(t=>{S.tamper=t.tampered;S.verify=null;return syncEvents()}).then(render)}else{S.tamper=!S.tamper;S.verify=null;render()}break;
   /* audio */
   case 'aud-toggle':audioToggle();break;
   case 'aud-stop':audioStop();break;
   case 'aud-speed':{const o=[1,1.25,0.85];S.cfg.rate=o[(o.indexOf(S.cfg.rate)+1)%3];render();break}
   case 'post-listen':{const f=FEED.find(x=>x.id===el.dataset.id);if(AUD.on&&AUD.single===f.id)audioStop();else audioPlay([f.title+'.',f.summary,f.why],f.id);break}
   /* feed */
   case 'news-filter':S.news.filter=val;render();break;
   case 'post-save':{const id=el.dataset.id;S.news.saved[id]=!S.news.saved[id];render();break}
   case 'post-idea':{const f=FEED.find(x=>x.id===el.dataset.id);if(!S.ideas.includes(f.idea)){S.ideas.push(f.idea);addEvent('idea.added','You added an idea from the news: '+f.idea+'. It is only an idea until you approve something.','idea stored; no action proposed')}render();break}
   case 'post-hide':{const f=FEED.find(x=>x.id===el.dataset.id);S.news.hidden[f.id]=true;addEvent('brief.hidden','You asked for fewer notes like "'+f.title+'".','preference stored; item hidden');render();break}
   case 'news-unhide':S.news.hidden={};render();break;
   case 'news-check':{S.news.checking=true;render();setTimeout(()=>{S.news.checking=false;addEvent('brief.generated','We checked again. Nothing new since this morning.','muse-spark-1.3 web_search x4; webcrawl diff x'+S.cfg.practices.length+'; 0 new candidates');render()},1500);break}
   /* configure */
   case 'open-config':S.tab='news';S.news.sub='config';render();window.scrollTo(0,0);break;
   case 'close-config':S.news.sub='feed';render();window.scrollTo(0,0);break;
   case 'cfg-topic':S.cfg.topics[val]=!S.cfg.topics[val];if(S.news.filter!=='all'&&S.news.filter!=='saved'&&!S.cfg.topics[S.news.filter])S.news.filter='all';render();cfgEvent((S.cfg.topics[val]?'You turned on ':'You turned off ')+TOPICS[val].label.toLowerCase()+' in your update.');break;
   case 'cfg-freq':S.cfg.freq=val;render();cfgEvent('You set your update to '+({daily:'every day',important:'only when something matters',weekly:'once a week'})[val]+'.');break;
   case 'cfg-time':S.cfg.time=val;render();cfgEvent('You set your update time to '+val+'.');break;
   case 'cfg-cap':S.cfg.cap=Number(val);render();cfgEvent('You set the most notes in one update to '+val+'.');break;
   case 'cfg-audio':S.cfg.audio=!S.cfg.audio;if(!S.cfg.audio)audioStop();render();cfgEvent('You turned audio '+(S.cfg.audio?'on':'off')+'.');break;
   case 'cfg-numbers':S.cfg.numbers=!S.cfg.numbers;render();cfgEvent('You turned the numbers line '+(S.cfg.numbers?'on':'off')+' in your audio.');break;
   case 'cfg-rate':S.cfg.rate=Number(val);render();cfgEvent('You set the audio speed.');break;
   case 'cfg-add':addPractice();break;
   case 'cfg-remove':{const p=S.cfg.practices.splice(Number(el.dataset.i),1)[0];render();cfgEvent('You stopped watching '+p.name+'.','practice allowlist -1');break}
  }});
applyBrand();init();render();
if(location.protocol.startsWith('http')){S.loading=true;render();api('GET','/health').then(async h=>{LIVE=true;S.drafter=h.drafter;await loadLive();S.loading=false;render()}).catch(()=>{LIVE=false;S.loading=false;render()})}
</script>
